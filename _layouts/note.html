---
layout: default
---
<article class="note">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="note-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {% if page.categories %}
      • 
      <span>Categories: 
        {% for category in page.categories %}
        <a href="/categories/{{ category | slugify }}/">{{ category }}</a>{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      </span>
      {% endif %}
    </p>
  </header>

  <div class="note-content">
    {{ content }}
  </div>
</article>
